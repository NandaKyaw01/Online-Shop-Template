<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <rect width="400" height="450" rx="16" fill="#1e3a8a"/>
  <rect x="20" y="20" width="360" height="55" rx="8" fill="#1d4ed8"/>
  <text x="200" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">KBZPay</text>
  
  <rect x="50" y="95" width="300" height="300" rx="12" fill="#ffffff"/>
  
  <!-- Outer Finder Patterns -->
  <rect x="75" y="120" width="60" height="60" fill="#1e3a8a"/>
  <rect x="85" y="130" width="40" height="40" fill="#ffffff"/>
  <rect x="95" y="140" width="20" height="20" fill="#1e3a8a"/>

  <rect x="265" y="120" width="60" height="60" fill="#1e3a8a"/>
  <rect x="275" y="130" width="40" height="40" fill="#ffffff"/>
  <rect x="285" y="140" width="20" height="20" fill="#1e3a8a"/>

  <rect x="75" y="310" width="60" height="60" fill="#1e3a8a"/>
  <rect x="85" y="320" width="40" height="40" fill="#ffffff"/>
  <rect x="95" y="330" width="20" height="20" fill="#1e3a8a"/>

  <!-- Simulated QR Pattern Blocks -->
  <rect x="155" y="120" width="20" height="20" fill="#1e3a8a"/>
  <rect x="195" y="120" width="40" height="20" fill="#1e3a8a"/>
  <rect x="155" y="160" width="40" height="20" fill="#1e3a8a"/>
  <rect x="215" y="160" width="20" height="20" fill="#1e3a8a"/>
  
  <!-- Center Logo Badge -->
  <circle cx="200" cy="245" r="30" fill="#1d4ed8" stroke="#ffffff" stroke-width="4"/>
  <text x="200" y="252" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">KPay</text>

  <!-- Data Grid Blocks -->
  <rect x="75" y="200" width="20" height="40" fill="#1e3a8a"/>
  <rect x="115" y="200" width="20" height="20" fill="#1e3a8a"/>
  <rect x="115" y="240" width="40" height="20" fill="#1e3a8a"/>
  <rect x="250" y="200" width="40" height="20" fill="#1e3a8a"/>
  <rect x="305" y="200" width="20" height="40" fill="#1e3a8a"/>
  <rect x="250" y="240" width="20" height="30" fill="#1e3a8a"/>
  <rect x="155" y="300" width="30" height="20" fill="#1e3a8a"/>
  <rect x="205" y="300" width="40" height="20" fill="#1e3a8a"/>
  <rect x="265" y="300" width="20" height="20" fill="#1e3a8a"/>
  <rect x="155" y="340" width="20" height="30" fill="#1e3a8a"/>
  <rect x="195" y="350" width="50" height="20" fill="#1e3a8a"/>
  <rect x="265" y="340" width="60" height="30" fill="#1e3a8a"/>

  <text x="200" y="422" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">Scan with KBZPay App</text>
